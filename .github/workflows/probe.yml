name: Fuel price probe
on:
  push:
    branches: [fuel-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests
      - name: Run the real fetch
        run: |
          mkdir -p data
          python tools/fetch_fuel_prices.py data/fuel-prices.json
          python tools/fetch_fuel_prices.py data/fuel-prices.json   # second run: must say "no new prices"
      - name: Save results
        run: |
          git config user.name "fuel-probe"
          git config user.email "actions@users.noreply.github.com"
          git add probe data
          git commit -m "probe results" || true
          git push
